name: Release

# Every push to main cuts a new patch release. Skipped for commits made by
# the version bump itself, which would otherwise loop forever.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "$CURRENT -> $NEXT"

          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = '$NEXT';
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\n');
          "
          # Keep Cargo.toml and package.json in step with the app version.
          sed -i "0,/^version = \".*\"/s//version = \"$NEXT\"/" src-tauri/Cargo.toml
          npm version "$NEXT" --no-git-tag-version --allow-same-version >/dev/null
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          set -euo pipefail
          V="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json package-lock.json
          git commit -m "chore: release v$V"
          git tag "v$V"
          git push origin HEAD:main --follow-tags

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # WebKitGTK and its build deps; on Linux Tauri links against the system
      # webview rather than shipping one.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl wget file libssl-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: Emulator Studio v${{ needs.version.outputs.version }}
          releaseBody: |
            Free and open source. Download the file for your platform below.

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Windows | `*_x64-setup.exe` |
            | Linux | `*_amd64.AppImage` or `*_amd64.deb` |

            macOS builds are unsigned: right-click the app and choose **Open** the first time.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
